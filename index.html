<!DOCTYPE html>
<html>
    <head>
        <title>Example Site</title>
    </head>

    <link href='https://fonts.googleapis.com/css?family=Notable' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Mukta' rel='stylesheet'>

    <style>

        h1 {
            font-family: cursive;
        }


        h2 {
            text-align: center; 
            font-size: 35px;
            font-family:'Notable';
        }

        h3 {
            position: absolute;
            font-size: 30px;
            font-family: 'Trebuchet MS', sans-serif;
            top: 180px;
        }

        ul {
            font-size: 15px; 
        }

        p {
            font-size: 20px;
        }

        img {
            width: 15%;
        }

        a {
            color: #327ba8;
        }

        a:visited {
            color: #327ba8;
        }

        button {
            cursor: pointer;
        }

        .sectionBreak {
            margin-top: 50px;
        }

        .hobbies {
            padding-bottom: 200px;
            width: 100%;
        }

        .hobbiesImg {
            position: absolute;
            border-radius: 20px;
            margin: 5px;
        }

        /* pop up for image */
        .container {
            width: 100%;
            position: relative;
            display: inline-block;
        }
        .container:hover .popup{
            display: block;
        }
        .popup {
            display: none;
            position: absolute;
            padding: 5px;
            width: 15%;
            border: #5ba6d4 3px solid;
            background-color: azure;
            color: #23a1eb;
            top: 150px;
            z-index: 5;
            text-align: left;
        }

        .animeContainer {
            position: relative;
            display: block;
            width: 50%;
        }

        .anime {
            position: absolute;
        }


        .project {
            font-size: 25px;
            font-family: 'Mukta';
            width: 100%;
        }

        .slideshow {
            position: relative;
            display: block;
            width: 60%;
            left: 12%;
            height: 50%;
            padding-bottom: 45%;
        }

        .slideshowImg {
            display: none;
            position: absolute;
            width:100%;
            left: 15%;
        }

        .slideshowBtn {
            position: absolute;
            z-index: 5;
            top:40%;
            font-size: 20px;
            padding: 10px;
            background-color: #c76df7;
            border: 20px;
        }

        .slideshowBtn:hover {
            background-color: #db9dfc;
        }

        .slideshowBtn:active {
            background-color: #b945f7;
        }

        .slideshowNum {
            position: absolute;
            left:15%;
            z-index: 5;
            font-size: 15px;
        }

        .locations {
            position: relative;
            display: block;
            width: 65%;
            height:10%;
        }

        .location {
            position: absolute;
        }

        .top {
            display: none;
            position: fixed;
            right: 0;
            bottom: 0;
            margin: 10px;
            padding: 20px 5px;
            font-size: 15px;
            color:#ffb5e6;
            background-color: #38a5ff;
            border-radius: 20px;
        }

        .top:hover {
            background-color: #7ac3ff;
        }

        .top:active {
            background-color: #1286e6;
        }

    </style>

    <body style="text-align: center;">
        <h1>This is a site</h1>
        <p>Go check out this <a href="https://app.chatsimple.ai">link</a></p>
        <img src="https://chatsimple-widget.s3.us-east-2.amazonaws.com/logo.png" alt="Random Image">
        
        
    </body>

    

</html>
